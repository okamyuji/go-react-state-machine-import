name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    uses: okamyuji/reusable-workflows/.github/workflows/go-ci.yml@v1
    with:
      working-directory: backend

  frontend:
    uses: okamyuji/reusable-workflows/.github/workflows/node-ci.yml@v1
    with:
      working-directory: frontend
      lint-command: run lint && pnpm run format:check
      typecheck-command: run typecheck && pnpm run build
      test-command: run test

  security:
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1
